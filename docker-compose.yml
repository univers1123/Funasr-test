services:
  subtitle:
    build: .
    image: funasr-subtitle:1.0
    ports:
      - "7860:7860"
    volumes:
      # 模型快取(首次啟動下載約 1-2GB,之後重用)
      - modelscope-cache:/root/.cache/modelscope
      # 輸出字幕檔
      - ./output:/data/output
    environment:
      - DEVICE=cuda:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # 測試階段不自動重啟:容器若崩潰會停下,才看得到錯誤
    # (docker compose logs subtitle 查原因);穩定後可改回 unless-stopped
    restart: "no"

volumes:
  modelscope-cache:
